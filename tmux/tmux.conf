set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre

set -g status-style bg=default
set -g window-status-style "fg=#6e6a86"
set -g window-status-current-style "fg=#31748f bold"
set -g window-status-activity-style "fg=#eb6f92"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

bind r source-file "~/.config/tmux/tmux.conf"
bind s display-popup -E -w 70% -h 60% -T "tmx sessions" "zsh -ic tmx"
bind-key -n S-Left swap-window -t -1\; select-window -t -1
bind-key -n S-Right swap-window -t +1\; select-window -t +1
bind b set -g status
bind E show-environment -g

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @yank_action 'copy-pipe'

# Local plugin: one tmux session per Git branch, backed by git worktree.
set -g @gwt-root "$HOME/src/git-worktrees"
set -g @gwt-open-key "G"
set -g @gwt-default-base "main"
set -g @gwt-remote "origin"
set -g @gwt-kill-source-session "on"
run-shell '~/.config/tmux/local-plugins/tmux-git-worktree-sessions/tmux-git-worktree-sessions.tmux'

if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'
if-shell -b '! command -v pbcopy >/dev/null 2>&1 && test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
if-shell -b '! command -v pbcopy >/dev/null 2>&1 && ! { test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1; } && test -n "$DISPLAY" && command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard -in"'

# Yank without leaving copy-mode, so copying scrollback does not jump back to the live pane.
bind-key -T copy-mode-vi y send-keys -X copy-pipe \; send-keys -X clear-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe \; send-keys -X clear-selection
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe \; send-keys -X clear-selection

run '~/.config/tmux/plugins/tpm/tpm'
