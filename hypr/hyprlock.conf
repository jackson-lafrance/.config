$base           = 0xff191724
$surface        = 0xff1f1d2e
$overlay        = 0xff26233a
$muted          = 0xff6e6a86
$subtle         = 0xff908caa
$text           = 0xffe0def4
$love           = 0xffeb6f92
$gold           = 0xfff6c177
$rose           = 0xffebbcba
$pine           = 0xff31748f
$foam           = 0xff9ccfd8
$iris           = 0xffc4a7e7
$highlightLow   = 0xff21202e
$highlightMed   = 0xff403d52
$highlightHigh  = 0xff524f67

general {
   hide_cursor = true
}

animations {
   enabled = true
   bezier = smooth, 0.25, 0.1, 0.25, 1.0
   animation = fadeIn, 1, 3, smooth
   animation = fadeOut, 1, 3, smooth
   animation = inputFieldDots, 1, 2, smooth
   animation = inputFieldWidth, 1, 2, smooth
}

background {
   monitor =
   path = screenshot
   blur_passes = 3
   blur_size = 8
   noise = 0.0117
   contrast = 0.90
   brightness = 0.80
   vibrancy = 0.18
   vibrancy_darkness = 0.15
}

shape {
   monitor = DP-1
   size = 840, 480
   color = rgba(31, 29, 46, 0.72)
   rounding = 24
   border_size = 2
   border_color = $highlightHigh
   shadow_passes = 3
   shadow_size = 10
   shadow_color = rgba(25, 23, 36, 0.40)

   position = 0, 0
   halign = center
   valign = center
}

label {
   monitor = DP-1
   text = $TIME
   color = $text
   font_size = 64
   font_family = $font

   position = 0, 78
   halign = center
   valign = center
}

label {
   monitor = DP-1
   text = cmd[update:60000] date +"%A • %d %B"
   color = $rose
   font_size = 20
   font_family = $font

   position = 0, 28
   halign = center
   valign = center
}

label {
   monitor = DP-1
   text = Hi, Jackson
   color = $muted
   font_size = 18
   font_family = $font

   position = 0, -14
   halign = center
   valign = center
}

input-field {
   monitor = DP-1
   size = 320, 54
   outline_thickness = 2
   dots_size = 0.22
   dots_spacing = 0.25
   dots_center = true

   inner_color = rgba(25, 23, 36, 0.65)
   outer_color = $iris $foam 45deg
   check_color = $foam $pine 45deg
   fail_color = $love $gold 45deg
   capslock_color = $gold

   font_color = $text
   font_family = $font
   placeholder_text = Password...
   fail_text = <i>$PAMFAIL</i>

   fade_on_empty = false
   hide_input = false
   rounding = 14

   position = 0, -82
   halign = center
   valign = center
}
